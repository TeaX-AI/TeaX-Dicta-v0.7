name: auto-sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push to actions branch
        run: |
          git config user.name "auto-sync"
          git config user.email "auto-sync@teax-ai.local"
          git push origin HEAD:actions --force
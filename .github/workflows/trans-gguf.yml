name: trans-gguf

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          cd DictionariDev
          pip install --upgrade pip
          pip install --no-cache-dir torch
          pip install --no-cache-dir numpy gguf

      - name: Download stage-f checkpoint
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p inputs/stage_e
          for i in 1 2 3 4 5; do
            echo "[download] attempt $i/5"
            if gh release download ckpt-stage-f \
              --pattern "model.pt" \
              --pattern "meta.json" \
              --dir inputs/stage_e \
              --clobber; then
              echo "[download] success"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "[download] all 5 attempts failed, aborting job"
              exit 1
            fi
            echo "[download] failed, waiting 15s before retry"
            sleep 15
          done

      - name: Convert pt to dim
        run: |
          cd DictionariDev
          python convert_to_dim.py \
            --input ../inputs/stage_e/model.pt \
            --meta ../inputs/stage_e/meta.json \
            --output ../outputs/teax-dicta-v0.7.dim \
            --with-model-roles

      - name: Convert dim to gguf
        run: |
          cd DictionariDev
          python convert_to_gguf.py \
            --dim ../outputs/teax-dicta-v0.7.dim \
            --output ../outputs/teax-dicta-v0.7.gguf

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd ./outputs
          TAG="teax-dicta-v0.7"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "TeaX-Dicta v0.7" \
              --notes "Auto-built release from stage-f checkpoint." \
              --target ${{ github.ref_name }}
          gh release upload "$TAG" teax-dicta-v0.7.dim --clobber
          gh release upload "$TAG" teax-dicta-v0.7.gguf --clobber
          gh release upload "$TAG" teax-dicta-v0.7.gguf.config.json --clobber
name: stage-f

on:
  workflow_dispatch:

concurrency:
  group: stage-f
  cancel-in-progress: false

jobs:
  train:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          cd DictionariDev
          pip install --upgrade pip
          pip install --no-cache-dir torch
          pip install --no-cache-dir -r requirements.txt

      - name: Download previous checkpoint
        id: ckpt
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p inputs/prev
          if gh release view ckpt-stage-f > /dev/null 2>&1; then
            TARGET_RELEASE="ckpt-stage-f"
          elif gh release view ckpt-stage-e > /dev/null 2>&1; then
            TARGET_RELEASE="ckpt-stage-e"
          else
            TARGET_RELEASE=""
          fi
          if [ -n "$TARGET_RELEASE" ]; then
            for i in 1 2 3 4 5; do
              echo "[download] attempt $i/5 from $TARGET_RELEASE"
              if gh release download "$TARGET_RELEASE" \
                --pattern "model.pt" \
                --pattern "meta.json" \
                --pattern "dictionari-model.json" \
                --dir inputs/prev \
                --clobber; then
                echo "[download] success"
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "[download] all 5 attempts failed, aborting job"
                exit 1
              fi
              echo "[download] failed, waiting 15s before retry"
              sleep 15
            done
          else
            echo "[download] no release found, first run"
          fi
          if [ -f inputs/prev/model.pt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Train stage-f
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd DictionariDev
          EXTRA=""
          if [ "${{ steps.ckpt.outputs.found }}" = "true" ]; then
            EXTRA="--resume_from ../inputs/prev/model.pt"
          fi
          python Train.py \
            --stage stage_f \
            --dataset yuyijiong/LongData-Corpus \
            --output_dir ../outputs/stage_f \
            --d_model 640 \
            --level_sizes "7,14,98" \
            --hidden_mult 3 \
            --top_k 2 \
            --trunk_blocks 5 \
            --seq_len 1024 \
            --epochs 2 \
            $EXTRA

      - name: Upload checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DIR=./outputs/stage_f
          if [ ! -f "$DIR/model.pt" ]; then
            echo "no checkpoint produced"
            exit 0
          fi
          gh release view ckpt-stage-f > /dev/null 2>&1 || \
            gh release create ckpt-stage-f \
              --title "stage-f checkpoint" \
              --notes "auto checkpoint" \
              --target ${{ github.ref_name }}
          gh release upload ckpt-stage-f "$DIR/model.pt" --clobber
          gh release upload ckpt-stage-f "$DIR/meta.json" --clobber
          gh release upload ckpt-stage-f "$DIR/dictionari-model.json" --clobber

      - name: Trigger next
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATUS="${{ job.status }}"
          echo "[trigger] job status: $STATUS"
          DIR=./outputs/stage_f
          if [ ! -f "$DIR/meta.json" ]; then
            echo "[skip] no meta.json produced, not re-triggering"
            exit 0
          fi
          DONE=$(python -c "import json; print(str(json.load(open('$DIR/meta.json')).get('complete', False)).lower())")
          if [ "$DONE" = "true" ]; then
            echo "stage-f complete, triggering trans-gguf"
            gh workflow run trans-gguf.yml --ref ${{ github.ref_name }}
          else
            echo "stage-f incomplete, re-triggering stage-f"
            gh workflow run stage-f.yml --ref ${{ github.ref_name }}
          fi
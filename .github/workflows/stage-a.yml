name: stage-a

on:
  workflow_dispatch:

concurrency:
  group: stage-a
  cancel-in-progress: false

jobs:
  train:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          cd DictionariDev
          pip install --upgrade pip
          pip install --no-cache-dir torch
          pip install --no-cache-dir -r requirements.txt

      - name: Download previous checkpoint
        id: ckpt
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p inputs/prev
          if gh release view ckpt-stage-a > /dev/null 2>&1; then
            for i in 1 2 3 4 5; do
              echo "[download] attempt $i/5"
              if gh release download ckpt-stage-a \
                --pattern "model.pt" \
                --pattern "meta.json" \
                --pattern "dictionari-model.json" \
                --dir inputs/prev \
                --clobber; then
                echo "[download] success"
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "[download] all 5 attempts failed, aborting job"
                exit 1
              fi
              echo "[download] failed, waiting 15s before retry"
              sleep 15
            done
          else
            echo "[download] release ckpt-stage-a does not exist, first run"
          fi
          if [ -f inputs/prev/model.pt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Train stage-a
        run: |
          cd DictionariDev
          EXTRA=""
          if [ "${{ steps.ckpt.outputs.found }}" = "true" ]; then
            EXTRA="--resume_from ../inputs/prev/model.pt"
          fi
          python Train.py \
            --stage stage_a \
            --dataset wikimedia/wikipedia \
            --dataset_config 20231101.en \
            --output_dir ../outputs/stage_a \
            --d_model 640 \
            --level_sizes "7,14,98" \
            --hidden_mult 3 \
            --top_k 2 \
            --epochs 2 \
            --shared_experts \
            --freeze_dict \
            $EXTRA

      - name: Upload checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DIR=./outputs/stage_a
          if [ ! -f "$DIR/model.pt" ]; then
            echo "no checkpoint produced"
            exit 0
          fi
          gh release view ckpt-stage-a > /dev/null 2>&1 || \
            gh release create ckpt-stage-a \
              --title "stage-a checkpoint" \
              --notes "auto checkpoint" \
              --target ${{ github.ref_name }}
          gh release upload ckpt-stage-a "$DIR/model.pt" --clobber
          gh release upload ckpt-stage-a "$DIR/meta.json" --clobber
          gh release upload ckpt-stage-a "$DIR/dictionari-model.json" --clobber

      - name: Trigger next
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATUS="${{ job.status }}"
          echo "[trigger] job status: $STATUS"
          DIR=./outputs/stage_a
          if [ ! -f "$DIR/meta.json" ]; then
            echo "[skip] no meta.json produced, not re-triggering"
            exit 0
          fi
          DONE=$(python -c "import json; print(str(json.load(open('$DIR/meta.json')).get('complete', False)).lower())")
          if [ "$DONE" = "true" ]; then
            echo "stage-a complete, triggering stage-b"
            gh workflow run stage-b.yml --ref ${{ github.ref_name }}
          else
            echo "stage-a incomplete, re-triggering stage-a"
            gh workflow run stage-a.yml --ref ${{ github.ref_name }}
          fi
name: trans-gguf

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actions
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir numpy gguf

      - name: Download stage-d checkpoint
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p inputs/stage_d
          gh release download ckpt-stage-d \
            --pattern "model.pt" \
            --pattern "meta.json" \
            --dir inputs/stage_d \
            --clobber

      - name: Convert to GGUF
        run: |
          python convert_to_gguf.py \
            --input inputs/stage_d/model.pt \
            --meta inputs/stage_d/meta.json \
            --output teax-dicta-v0.7.gguf

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG="teax-dicta-v0.7"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "TeaX-Dicta v0.7" \
              --notes "Auto-built release from stage-d checkpoint." \
              --target main
          gh release upload "$TAG" teax-dicta-v0.7.gguf --clobber